name: HaterOfTheMatch
options:
  bundleIdPrefix: com.haterofthematch
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  HaterOfTheMatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HaterOfTheMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haterofthematch.app
        INFOPLIST_FILE: HaterOfTheMatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: HaterOfTheMatch/Info.plist
      properties:
        CFBundleDisplayName: HaterOfTheMatch
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
